[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".venv",
    "staticfiles",
    "model_files",
    "model_files_cache",
    "container-media",
    "container-data",
    "container-metrics",
    ".playwright-mcp",
    "single-page-ui",
    "lpr_app/migrations",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Test modules and manual scripts may use long URLs and legacy idioms.
"lpr_app/tests/*" = ["E501"]
"scripts/*" = ["E501", "UP"]
"manage.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["lpr_app", "lpr_project"]
