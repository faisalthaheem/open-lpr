{% extends 'base.html' %}

{% block title %}{{ error_title|default:"Error" }}{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-6 mx-auto">
        <div class="card shadow-sm">
            <div class="card-body text-center py-5">
                <i class="bi bi-exclamation-triangle display-1 text-warning mb-3" style="font-size: 4rem;"></i>
                <h4 class="card-title mb-3">{{ error_title|default:"Error" }}</h4>
                <p class="text-muted mb-4">{{ error_message|default:"An unexpected error occurred." }}</p>
                <a href="javascript:history.back()" class="btn btn-outline-primary">
                    <i class="bi bi-arrow-left me-1"></i>Go Back
                </a>
                <a href="{% url 'lpr_app:home' %}" class="btn btn-primary ms-2">
                    <i class="bi bi-house me-1"></i>Home
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
